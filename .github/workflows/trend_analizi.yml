name: Gunluk Trend Analizi

on:
  schedule:
    # 1. AVRUPA AÇILIŞI (İsviçre 09:15 hedefli)
    # Kuyruğa takılmamak için 08:12 UTC (İsviçre 09:12) tetiklenir.
    # Rapor tam 09:15 sularında Telegram'a düşer.
    - cron: '12 8 * * 1-5'
    
    # 2. ABD AÇILIŞI (İsviçre 15:45 hedefli - Pazartesi ve Cuma)
    # Kuyruğa takılmamak için 14:42 UTC (İsviçre 15:42) tetiklenir.
    # Rapor tam 15:45 sularında Telegram'a düşer.
    - cron: '42 14 * * 1,5'

  workflow_dispatch: # İstediğin zaman manuel çalıştırmak için

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest # Windows'a göre 5 kat daha hızlı başlar

    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests google-genai

      - name: Trend Botunu Calistir
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u trend_bot.py

      - name: Sinyal Gecmisini Commitle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f signals_history.csv ]; then
            git add signals_history.csv
            git diff --staged --quiet || git commit -m "chore: sinyal gecmisi guncellendi [skip ci]"
            git push
          fi
