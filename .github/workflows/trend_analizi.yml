name: Gunluk Trend Analizi

on:
  schedule:
    # 1. AVRUPA AÇILIŞI + 15 DK (İsviçre 09:15)
    # Kış saati (CET / UTC+1) için UTC 08:15 (Yaz saatinde 10:15'e denk gelir, istersen yazın 07:15 yapabilirsin)
    - cron: '15 8 * * 1-5'
    
    # 2. ABD AÇILIŞI + 15 DK (İsviçre 15:45 - Sadece Pazartesi ve Cuma)
    # Kış saati (CET / UTC+1) için UTC 14:45
    - cron: '45 14 * * 1,5'

  workflow_dispatch: # İstediğin zaman butona basıp manuel çalıştırmak için

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest # Windows yerine çok daha hızlı ve stabil olan Linux

    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kutuphaneleri Doğrudan Yukle
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests google-genai

      - name: Trend Botunu Calistir
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u trend_bot.py

      - name: Sinyal Gecmisini Commitle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f signals_history.csv ]; then
            git add signals_history.csv
            git diff --staged --quiet || git commit -m "chore: sinyal gecmisi guncellendi [skip ci]"
            git push
          fi
